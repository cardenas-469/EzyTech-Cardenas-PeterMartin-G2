<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}EzyTech{% endblock %}</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f4f6f8;color:#222}
nav{background:#1f3a5f;color:#fff;padding:12px 24px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
nav a,nav button{color:#fff;text-decoration:none;background:none;border:none;font-size:16px;cursor:pointer}
nav .brand{font-weight:bold;font-size:20px;margin-right:auto}
.container{max-width:520px;margin:32px auto;background:#fff;padding:24px;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.field{margin-bottom:14px}
label{display:block;font-weight:bold;margin-bottom:4px}
input{width:100%;padding:8px;box-sizing:border-box}
.btn{background:#1f3a5f;color:#fff;padding:10px 16px;border:none;border-radius:4px;cursor:pointer;text-decoration:none;display:inline-block}
.msg{padding:10px 14px;border-radius:4px;margin-bottom:12px}
.msg.success{background:#d4edda;color:#155724}
.msg.error{background:#f8d7da;color:#721c24}
.err{color:#b00020;font-size:14px;margin:4px 0 0}
.helptext{font-size:12px;color:#666}
img.avatar{width:120px;height:120px;object-fit:cover;border-radius:50%}
</style>
</head>
<body>
<nav>
  <span class="brand">EzyTech</span>
  {% if user.is_authenticated %}
    <a href="{% url 'dashboard_redirect' %}">Dashboard</a>
    <a href="{% url 'profile' %}">Profile</a>
    <span>{{ user.username }} ({{ user.get_role_display }})</span>
    <form method="post" action="{% url 'logout' %}" style="margin:0">{% csrf_token %}<button type="submit">Logout</button></form>
  {% else %}
    <a href="{% url 'login' %}">Login</a>
    <a href="{% url 'register' %}">Register</a>
  {% endif %}
</nav>
<div class="container">
  {% for message in messages %}
    <div class="msg {{ message.tags }}">{{ message }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</div>
</body>
</html>
