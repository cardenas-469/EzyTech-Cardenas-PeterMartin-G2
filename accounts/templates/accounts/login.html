{% extends 'accounts/base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<h2>Login</h2>
{% if form.errors %}
  <div class="msg error">Invalid username or password. Please try again.</div>
{% endif %}
<form method="post">
  {% csrf_token %}
  <div class="field"><label>Username</label>{{ form.username }}</div>
  <div class="field"><label>Password</label>{{ form.password }}</div>
  <button class="btn" type="submit">Login</button>
</form>
<p>No account? <a href="{% url 'register' %}">Register here</a></p>
{% endblock %}
