{% extends 'accounts/base.html' %}
{% block title %}Delete Product{% endblock %}
{% block content %}
<h2>Delete Product</h2>
<p>Are you sure you want to delete <strong>{{ product.name }}</strong>?</p>
<p class="muted">Products that already have orders cannot be deleted, so order history stays intact.</p>

<form method="post">
  {% csrf_token %}
  <button type="submit" class="btn danger">Yes, delete product</button>
  <a href="{% url 'product_list' %}" class="btn secondary">Cancel</a>
</form>
{% endblock %}
